<title>Menger Studio</title>
<meta name="description" content="Menger Studio: juegos pequeños hechos en casa. Web en pruebas.">
<meta name="robots" content="noindex">

<meta property="og:title" content="Menger Studio">
<meta property="og:description" content="Juegos pequeños hechos en casa. Pruébalos y cuéntanos qué te parecen.">
<meta property="og:image" content="img/rodamons-banner.webp">

<style>
/* Layout: aviso beta → barra → escaparate con vídeo → estantería 2:3 → buzón; la ficha es una capa a pantalla completa. */
:root {
  --ink: #07080f; --deck: #10121f; --deck-2: #181b2e; --line: #262a46;
  --text: #eceeff; --muted: #8d93bd; --amber: #ffb547; --cyan: #63e6ff; --good: #6ff2a4; --cone: #ff7a29;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace;
  --r: 14px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--ink); }
body { margin: 0; background: var(--ink); color: var(--text); font: 400 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; padding-top: env(safe-area-inset-top, 0px); }
img, video { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gut-r); }
.ico { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* aviso de pruebas */
.beta { background: repeating-linear-gradient(-45deg, #2a1a05 0 12px, #1f1304 12px 24px); border-bottom: 1px solid #5a3a0c; color: #ffd9a6; font-size: 13px; }
.beta .wrap { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.beta b { font: 700 11px var(--display); letter-spacing: .1em; background: var(--amber); color: #241400; padding: 3px 7px; border-radius: 5px; flex: none; }

/* barra */
.bar { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--ink) 82%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.brand svg { width: 28px; height: 28px; }
.brand b { font: 800 14px/1 var(--display); letter-spacing: .14em; }
.brand b span { color: var(--amber); }
.nav { display: flex; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 8px; text-decoration: none; padding: 8px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px; }
.nav a:hover { color: var(--text); background: var(--deck-2); }
.lang { position: relative; }
.lang > button { display: flex; align-items: center; gap: 8px; background: var(--deck); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px 6px 7px; cursor: pointer; font-weight: 600; font-size: 13px; }
.flag { width: 24px; height: 16px; border-radius: 3px; overflow: hidden; flex: none; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
.lang ul { position: absolute; right: 0; top: calc(100% + 8px); list-style: none; margin: 0; padding: 6px; background: var(--deck); border: 1px solid var(--line); border-radius: 12px; min-width: 180px; box-shadow: 0 20px 50px rgba(0,0,0,.5); z-index: 60; }
.lang li button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; }
.lang li button:hover, .lang li button[aria-current="true"] { background: var(--deck-2); }
.lang li button[aria-current="true"]::after { content: "●"; margin-left: auto; color: var(--amber); font-size: 9px; }
@media (max-width: 720px) { .nav { display: none; } .lang .lname { display: none; } }

/* escaparate */
.hero { padding-block: 20px 8px; }
.stage { position: relative; }
.frame { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 2 / 1; max-width: 100%; background: var(--deck); border: 1px solid var(--line); }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease, transform 6s ease; transform: scale(1.04); }
.slide.on { opacity: 1; transform: scale(1); }
.slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(7,8,15,.92) 0%, rgba(7,8,15,0) 42%); pointer-events: none; }
.stage-ui { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; align-items: flex-end; gap: 16px; padding: 22px 24px; flex-wrap: wrap; }
.stage-ui .who { margin-right: auto; display: grid; gap: 8px; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px); white-space: nowrap; }
.chip.hot { background: color-mix(in srgb, var(--amber) 20%, transparent); border-color: color-mix(in srgb, var(--amber) 45%, transparent); color: #ffe0ad; }
.chip.stage-chip { background: color-mix(in srgb, var(--cyan) 14%, transparent); border-color: color-mix(in srgb, var(--cyan) 40%, transparent); color: #c8f6ff; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none; font: 700 14px/1 var(--body); padding: 13px 18px; border-radius: 999px; background: var(--text); color: var(--ink); white-space: nowrap; }
.btn:hover { background: #fff; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid rgba(255,255,255,.18); }
.btn.ghost:hover { background: rgba(255,255,255,.14); }
.btn.amber { background: var(--amber); color: #241400; }
.btn:disabled { opacity: .5; cursor: default; }
.dots { position: absolute; top: 16px; right: 18px; z-index: 2; display: flex; gap: 6px; }
.dots button { width: 26px; height: 4px; border: 0; padding: 0; border-radius: 4px; background: rgba(255,255,255,.3); cursor: pointer; }
.dots button.on { background: var(--amber); }
@media (max-width: 640px) {
  .frame { border-radius: 16px; }
  .frame::after { background: linear-gradient(0deg, rgba(7,8,15,.5) 0%, rgba(7,8,15,0) 30%); }
  .stage-ui { position: static; padding: 12px 0 0; gap: 10px; flex-wrap: nowrap; align-items: center; }
  .dots { top: 10px; right: 12px; }
}

/* secciones */
.sec { padding-block: 36px 8px; }
.sec-h { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
.sec-h .badge { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--deck-2); border: 1px solid var(--line); color: var(--amber); }
.sec-h .badge .ico { width: 20px; height: 20px; }
.sec-h h2 { font: 700 clamp(18px, 2.4vw, 22px)/1.1 var(--display); margin: 0; text-wrap: balance; }
.sec-h p { margin: 0 0 0 auto; color: var(--muted); font-size: 14px; }

/* estantería */
.shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } }
.card { position: relative; display: block; border-radius: var(--r); overflow: hidden; aspect-ratio: 2 / 3; max-width: 100%; background: var(--deck); border: 1px solid var(--line); transition: transform .25s ease, box-shadow .25s ease, border-color .25s; cursor: pointer; padding: 0; width: 100%; }
.card img, .card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card video { opacity: 0; transition: opacity .3s; }
.card.playing video { opacity: 1; }
.card:hover, .card:focus-visible { transform: translateY(-6px); box-shadow: 0 22px 50px -18px var(--glow); border-color: color-mix(in srgb, var(--glow) 60%, transparent); }
.card .meta { position: absolute; inset: auto 0 0 0; padding: 40px 12px 12px; display: flex; align-items: center; gap: 8px; background: linear-gradient(0deg, rgba(7,8,15,.95), rgba(7,8,15,0)); }
.card .meta .plats { display: flex; gap: 6px; color: var(--muted); margin-left: auto; }
.card .try { font: 700 11px var(--body); padding: 5px 9px; border-radius: 999px; background: var(--good); color: #062512; display: inline-flex; gap: 5px; align-items: center; }
.card .try.soon { background: rgba(255,255,255,.1); color: var(--muted); }

/* buzón */
.fb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .fb-grid { grid-template-columns: 1fr; } }
.fb-pick { display: flex; align-items: center; gap: 16px; padding: 20px; border-radius: 18px; border: 1px solid var(--line); background: var(--deck); cursor: pointer; text-align: left; transition: border-color .2s, background .2s; }
.fb-pick:hover { border-color: #3a3f66; }
.fb-pick[aria-pressed="true"] { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 8%, var(--deck)); }
.fb-pick .big { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; flex: none; }
.fb-pick .big .ico { width: 26px; height: 26px; }
.fb-pick b { display: block; font: 700 15px/1.2 var(--display); }
.fb-pick small { color: var(--muted); font-size: 14px; }
form.fb { margin-top: 16px; padding: 20px; border-radius: 18px; background: var(--deck); border: 1px solid var(--line); display: grid; gap: 14px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .row2 { grid-template-columns: 1fr; } }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea { width: 100%; background: var(--ink); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 400 16px/1.4 var(--body); }
.f textarea { min-height: 110px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--cyan); }
.acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.msg { font-size: 14px; color: var(--muted); }
.msg.ok { color: var(--good); }
.msg.err { color: #ff9b8a; }
.honey { position: absolute; left: -5000px; }
.privacy { font-size: 12.5px; color: var(--muted); margin: 0; }

footer { margin-top: 56px; border-top: 1px solid var(--line); padding-block: 26px 40px; color: var(--muted); font-size: 13px; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
footer .wrap { display: flex; gap: 14px 18px; flex-wrap: wrap; align-items: center; }
footer .flags { display: flex; gap: 6px; margin-left: auto; }
footer .flags button { background: none; border: 0; padding: 3px; cursor: pointer; border-radius: 5px; opacity: .55; }
footer .flags button[aria-current="true"], footer .flags button:hover { opacity: 1; }

/* ficha */
.sheet { position: fixed; inset: 0; z-index: 80; background: var(--ink); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .close { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); z-index: 5; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(7,8,15,.7); backdrop-filter: blur(8px); cursor: pointer; display: grid; place-items: center; }
.backdrop { position: relative; height: clamp(160px, 30vw, 360px); overflow: hidden; }
.backdrop img { width: 100%; height: 100%; object-fit: cover; display: block; }
.backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--ink) 0%, rgba(7,8,15,.55) 50%, rgba(7,8,15,.1) 100%); }
.head { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; margin-top: -120px; position: relative; z-index: 2; }
.head .poster { grid-row: span 2; width: 100%; aspect-ratio: 2 / 3; max-width: 100%; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); }
.head .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.head h1 { font: 800 clamp(28px, 5vw, 50px)/1 var(--display); margin: 60px 0 12px; text-wrap: balance; }
.head .lead { grid-column: 2; align-self: start; font-size: 18px; color: #c8ccef; max-width: 60ch; margin: 0; }
@media (max-width: 700px) {
  .head { grid-template-columns: 110px minmax(0, 1fr); gap: 16px; margin-top: -70px; }
  .head .poster { grid-row: auto; }
  .head h1 { margin-top: 40px; font-size: 26px; }
  .head .lead { grid-column: 1 / -1; font-size: 16px; }
}
.blocks { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; margin-top: 30px; }
.blk { grid-column: span 6; background: var(--deck); border: 1px solid var(--line); border-radius: 18px; padding: 20px; min-width: 0; }
.blk.wide { grid-column: 1 / -1; }
@media (max-width: 900px) { .blk { grid-column: 1 / -1; } }
.blk h3 { display: flex; align-items: center; gap: 10px; font: 700 15px/1.2 var(--display); margin: 0 0 16px; }
.blk h3 .ico { color: var(--amber); width: 20px; height: 20px; }
.blk h3 small { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); }
.player { display: grid; place-items: center; background: #000; border-radius: 12px; overflow: hidden; }
.player video { display: block; width: 100%; max-height: 70vh; object-fit: contain; }
.player.tall video { width: auto; height: min(70vh, 640px); max-width: 100%; }
.demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.demo { border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; background: var(--deck-2); min-width: 0; }
.demo .top { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.demo .top .ico { width: 22px; height: 22px; color: var(--cyan); }
.demo .qr { background: #fff; border-radius: 10px; padding: 10px; width: 148px; max-width: 100%; aspect-ratio: 1; display: grid; place-items: center; justify-self: center; }
.demo .qr img, .demo .qr canvas { width: 100% !important; height: auto !important; display: block; }
.demo .warn { font-size: 12.5px; color: #ffd9a6; display: flex; gap: 6px; }
.demo .warn .ico { color: var(--amber); margin-top: 2px; }
.demo.soon { background: repeating-linear-gradient(-45deg, rgba(255,122,41,.06) 0 14px, transparent 14px 28px), var(--deck-2); border-style: dashed; }
.demo.soon .top .ico { color: var(--muted); }
.demo.soon .cone { width: 64px; height: 64px; justify-self: center; }
.demo.soon .lbl { justify-self: center; font: 700 12px var(--display); letter-spacing: .06em; color: var(--cone); text-transform: uppercase; }
.rate { display: flex; gap: 8px; flex-wrap: wrap; }
.rate button { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--deck-2); cursor: pointer; display: grid; place-items: center; }
.rate button svg { width: 30px; height: 30px; }
.rate button[aria-pressed="true"] { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--deck-2)); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>

let lang = "es";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t = k => (UI[k] && (UI[k][lang] || UI[k].es)) || k;
const L = o => (o && (o[lang] || o.es)) || "";
const ico = (id, cls = "ico") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const playable = g => g.demos.some(d => d.url);
const absUrl = u => /^https?:/.test(u) ? u : SITE + u;

(function logo() {
  let h = "";
  const hole = (x, y) => { while (x || y) { if (x % 3 === 1 && y % 3 === 1) return true; x = Math.floor(x / 3); y = Math.floor(y / 3); } return false; };
  for (let y = 0; y < 9; y++) for (let x = 0; x < 9; x++) if (!hole(x, y)) {
    const warm = (x + y) % 4 === 0;
    h += `<rect x="${x*3}" y="${y*3}" width="2.4" height="2.4" rx=".5" fill="${warm ? "#ffb547" : "#63e6ff"}"/>`;
  }
  $("#logo").innerHTML = h;
})();

/* escaparate */
let slideIdx = 0, slideTimer = null;
function renderStage() {
  const stage = $("#stage"), dots = $("#dots");
  GAMES.forEach((g, i) => {
    const s = document.createElement("div");
    s.className = "slide";
    s.innerHTML = `<img src="img/${g.id}-banner.webp" alt="${esc(g.name)}" ${i ? 'loading="lazy"' : ""}>`;
    stage.insertBefore(s, dots);
    const b = document.createElement("button");
    b.setAttribute("aria-label", g.name);
    b.onclick = () => { showSlide(i); restartTimer(); };
    dots.appendChild(b);
  });
}
function showSlide(i) {
  slideIdx = (i + GAMES.length) % GAMES.length;
  $("#stage").querySelectorAll(".slide").forEach((s, k) => s.classList.toggle("on", k === slideIdx));
  [...$("#dots").children].forEach((d, k) => d.classList.toggle("on", k === slideIdx));
  const g = GAMES[slideIdx];
  $("#stageChips").innerHTML = `<span class="chip hot">${ico("i-pad")}${esc(L(g.genre))}</span><span class="chip stage-chip">${ico("i-flask")}${esc(t(g.stage))}</span>` +
    (playable(g) ? `<span class="chip">${ico("i-play")}${esc(t("tryIt"))}</span>` : "");
  $("#stageOpen").onclick = () => openGame(g.id);
}
function restartTimer() {
  clearInterval(slideTimer);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  slideTimer = setInterval(() => { if (!document.hidden && $("#sheet").hidden) showSlide(slideIdx + 1); }, 6000);
}

/* estantería: el vídeo asoma al pasar el ratón */
function renderShelf() {
  $("#shelf").innerHTML = GAMES.map(g => `
    <button class="card" style="--glow:${g.glow}" data-open="${g.id}" aria-label="${esc(g.name)} · ${esc(L(g.genre))}">
      <img src="img/${g.id}-poster.webp" alt="" loading="lazy">
      <video muted loop playsinline preload="none" data-src="video/${g.id}.mp4"></video>
      <span class="meta">
        <span class="try ${playable(g) ? "" : "soon"}">${playable(g) ? ico("i-play") + esc(t("tryIt")) : esc(t("soon"))}</span>
        <span class="plats">${[...new Set(g.demos.map(d => d.plat))].map(p => ico(PLAT[p].ico)).join("")}</span>
      </span>
    </button>`).join("");
  const hover = matchMedia("(hover: hover)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("#shelf").querySelectorAll(".card").forEach(c => {
    c.onclick = () => openGame(c.dataset.open);
    if (!hover) return;
    const v = c.querySelector("video");
    c.addEventListener("mouseenter", () => { if (!v.src) v.src = v.dataset.src; v.play().then(() => c.classList.add("playing")).catch(() => {}); });
    c.addEventListener("mouseleave", () => { c.classList.remove("playing"); v.pause(); });
  });
}

/* ficha */
let current = null, lastFocus = null, rating = 0;
function openGame(id, fromHash) {
  if (!GAMES.some(g => g.id === id)) return;
  current = id; rating = 0;
  if (!fromHash) { lastFocus = document.activeElement; try { history.replaceState(null, "", "#" + id); } catch {} }
  renderSheet();
  $("#sheet").hidden = false; $("#sheet").scrollTop = 0;
  document.body.style.overflow = "hidden";
  $("#sheetClose").focus();
}
function closeGame() {
  current = null;
  const v = $("#sheetBody video"); if (v) v.pause();
  $("#sheet").hidden = true; document.body.style.overflow = "";
  try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  if (lastFocus) lastFocus.focus();
}
function renderSheet() {
  const g = GAMES.find(x => x.id === current); if (!g) return;
  const demos = g.demos.map(d => {
    const pl = PLAT[d.plat];
    if (!d.url) return `<div class="demo soon"><div class="top">${ico(pl.ico)}${pl.name}</div><svg class="cone" viewBox="0 0 64 64" aria-hidden="true"><use href="#cone"/></svg><span class="lbl">${esc(t("soon"))}</span></div>`;
    const label = d.kind === "play" ? t("play") : d.kind === "proto" ? t("playProto") : t("download") + (d.size ? " · " + d.size : "");
    return `<div class="demo"><div class="top">${ico(pl.ico)}${pl.name}</div>
      <a class="btn ${d.kind === "dl" ? "" : "amber"}" href="${esc(d.url)}" target="_blank" rel="noopener">${ico(d.kind === "dl" ? "i-dl" : "i-play")}${esc(label)}</a>
      <div class="qr" data-qr="${esc(absUrl(d.url))}" title="${esc(t("scan"))}"></div>
      ${d.warn ? `<span class="warn">${ico("i-alert")}<span>${esc(t(d.warn))}</span></span>` : ""}</div>`;
  }).join("");
  const faces = [1,2,3,4,5].map(n => `<button type="button" data-rate="${n}" aria-pressed="false" aria-label="${n}/5"><svg viewBox="0 0 32 32"><use href="#f${n}"/></svg></button>`).join("");
  $("#sheetBody").innerHTML = `
    <div class="backdrop"><img src="img/${g.id}-banner.webp" alt=""></div>
    <div class="wrap">
      <div class="head">
        <div class="poster"><img src="img/${g.id}-poster.webp" alt="${esc(g.name)}"></div>
        <div style="min-width:0">
          <h1 id="sheetTitle">${esc(g.name)}</h1>
          <div class="chips">
            <span class="chip hot">${ico("i-pad")}${esc(L(g.genre))}</span>
            <span class="chip stage-chip">${ico("i-flask")}${esc(t(g.stage))}</span>
            <span class="chip">${ico("i-users")}${esc(g.players)}</span>
          </div>
        </div>
        <p class="lead">${esc(L(g.desc))}</p>
      </div>
      <div class="blocks">
        <section class="blk wide">
          <h3>${ico("i-film")}${esc(t("video"))}<small>${esc(t("videoNote"))}</small></h3>
          <div class="player ${g.tall ? "tall" : ""}"><video src="video/${g.id}.mp4" poster="video/${g.id}.jpg" muted loop playsinline autoplay controls preload="metadata"></video></div>
        </section>
        <section class="blk">
          <h3>${ico("i-play")}${esc(t("demos"))}<small>${esc(t("scan"))}</small></h3>
          <div class="demos">${demos}</div>
        </section>
        <section class="blk">
          <h3>${ico("i-msg")}${esc(t("rateTitle"))}<small>${esc(t("rateSub"))}</small></h3>
          <form class="fb" id="rateForm" novalidate style="margin:0;padding:0;border:0;background:none">
            <div class="rate">${faces}</div>
            <label class="f"><span>${esc(t("rateHow"))}</span><textarea id="rateText" maxlength="2000"></textarea></label>
            <label class="f"><span>${esc(t("fName"))}</span><input id="rateName" maxlength="60" autocomplete="nickname"></label>
            <input class="honey" id="rateHoney" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="acts"><button class="btn amber" type="submit">${ico("i-arrow")}${esc(t("send"))}</button><span class="msg" id="rateMsg" role="status"></span></div>
          </form>
        </section>
      </div>
    </div>`;
  $("#sheetBody").querySelectorAll("[data-rate]").forEach(b => b.onclick = () => {
    rating = +b.dataset.rate;
    $("#sheetBody").querySelectorAll("[data-rate]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("#rateForm").onsubmit = async e => {
    e.preventDefault();
    const text = $("#rateText").value.trim();
    if (!rating && !text) return setMsg("#rateMsg", t("empty"), "err");
    const ok = await send({ _subject: `[Menger] ${g.name}: ${rating ? rating + "/5" : "opinión"}`, tipo: "opinión", juego: g.name, nota: rating ? rating + "/5" : "-", mensaje: text || "-", nombre: $("#rateName").value.trim() || "-" }, $("#rateHoney").value, "#rateMsg");
    if (ok) { $("#rateText").value = ""; }
  };
  $("#sheetBody").querySelectorAll("[data-qr]").forEach(el => {
    if (typeof QRCode === "undefined") return;
    new QRCode(el, { text: el.dataset.qr, width: 256, height: 256, colorDark: "#07080f", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
    const img = el.querySelector("img"); if (img) img.alt = "QR";
  });
}
$("#sheetClose").onclick = closeGame;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeGame(); });

/* envío */
function setMsg(sel, txt, cls = "") { const m = $(sel); if (m) { m.textContent = txt; m.className = "msg " + cls; } }
async function send(fields, honey, msgSel) {
  if (honey) { setMsg(msgSel, t("sent"), "ok"); return true; }
  setMsg(msgSel, t("sending"));
  try {
    const r = await fetch(FORM_URL, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ ...fields, idioma: lang, _template: "table", _captcha: "false" }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && String(j.success) !== "false") { setMsg(msgSel, t("sent"), "ok"); return true; }
    throw new Error(j.message || r.status);
  } catch (err) { setMsg(msgSel, t("failed"), "err"); return false; }
}

let kind = "mecanica";
document.querySelectorAll(".fb-pick").forEach(b => b.onclick = () => {
  kind = b.dataset.kind;
  document.querySelectorAll(".fb-pick").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  $("#ideaGameWrap").hidden = kind !== "mecanica";
  setMsg("#ideaMsg", "");
});
function renderGameSelect() {
  const v = $("#ideaGame").value;
  $("#ideaGame").innerHTML = `<option value="-">${esc(t("anyGame"))}</option>` + GAMES.map(g => `<option value="${g.name}">${esc(g.name)}</option>`).join("");
  if (v) $("#ideaGame").value = v;
}
$("#ideaForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("#ideaText").value.trim();
  if (!text) { setMsg("#ideaMsg", t("emptyIdea"), "err"); $("#ideaText").focus(); return; }
  const game = kind === "mecanica" ? $("#ideaGame").value : "-";
  const ok = await send({ _subject: kind === "mecanica" ? `[Menger] Idea: ${game === "-" ? "general" : game}` : "[Menger] Juego nuevo", tipo: kind === "mecanica" ? "mecánica / mejora" : "juego nuevo", juego: game, mensaje: text, nombre: $("#ideaName").value.trim() || "-" }, $("#ideaHoney").value, "#ideaMsg");
  if (ok) $("#ideaText").value = "";
};

/* idioma */
function renderLangUI() {
  $("#langFlag").innerHTML = FLAGS[lang];
  $("#langName").textContent = LANGS.find(l => l[0] === lang)[1];
  $("#langMenu").innerHTML = LANGS.map(([c, n]) => `<li><button role="option" data-lang="${c}" aria-current="${c === lang}" lang="${c}">${FLAGS[c]}${n}</button></li>`).join("");
  $("#footFlags").innerHTML = LANGS.map(([c, n]) => `<button data-lang="${c}" aria-current="${c === lang}" title="${n}" aria-label="${n}">${FLAGS[c]}</button>`).join("");
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { setLang(b.dataset.lang); toggleMenu(false); });
}
function toggleMenu(open) { const m = $("#langMenu"); open = open ?? m.hidden; m.hidden = !open; $("#langBtn").setAttribute("aria-expanded", String(open)); }
$("#langBtn").onclick = e => { e.stopPropagation(); toggleMenu(); };
document.addEventListener("click", e => { if (!e.target.closest(".lang")) toggleMenu(false); });
function setLang(l) {
  lang = LANGS.some(x => x[0] === l) ? l : "es";
  store.set("ms-lang", lang);
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => n.textContent = t(n.dataset.t));
  renderLangUI(); showSlide(slideIdx); renderShelf(); renderGameSelect();
  if (current) renderSheet();
}

function initialLang() {
  const saved = store.get("ms-lang"); if (saved) return saved;
  const nav = (navigator.language || "es").toLowerCase();
  const hit = LANGS.find(([c]) => nav.startsWith(c));
  return hit ? hit[0] : "en";
}
renderStage();
setLang(initialLang());
restartTimer();
const h = location.hash.slice(1);
if (GAMES.some(g => g.id === h)) openGame(h, true);
})();
</script>
